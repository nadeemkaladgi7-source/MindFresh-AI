<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindFresh AI | Nature Sounds</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
padding:20px;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{
font-size:48px;
color:#00eaff;
margin-bottom:10px;
}

.hero p{
font-size:18px;
color:#ddd;
}

.sound-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
margin-top:40px;
}

.sound-card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(15px);
border-radius:20px;
padding:25px;
text-align:center;
transition:.4s;
box-shadow:0 0 15px rgba(0,0,0,.3);
}

.sound-card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px #00eaff;
}

.sound-card h2{
    color:#00eaff;
    margin-bottom:10px;
}

.sound-card p{
    color:#ddd;
    margin-bottom:15px;
}

button{
    background:#00eaff;
    color:#000;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#00c8d7;
}

.controls{
    text-align:center;
    margin-top:30px;
}

audio{
    display:none;
}

</style>

</head>

<body>

<header class="hero">

<h1>🌿 Nature Sounds</h1>

<p>Relax your mind with beautiful natural sounds.</p>

</header>

<section class="sound-grid">

<div class="sound-card">
<h2>🌧️ Rain</h2>
<p>Calm rain for deep relaxation.</p>
<button onclick="playSound('rain')">▶ Play</button>
</div>

<div class="sound-card">
<h2>🌲 Forest</h2>
<p>Peaceful forest ambience.</p>
<button onclick="playSound('forest')">▶ Play</button>
</div>

<div class="sound-card">
<h2>🌊 Ocean</h2>
<p>Relaxing sea waves.</p>
<button onclick="playSound('ocean')">▶ Play</button>
</div>

<div class="sound-card">
<h2>🐦 Birds</h2>
<p>Morning birds singing.</p>
<button onclick="playSound('birds')">▶ Play</button>
</div>

<div class="sound-card">
<h2>💨 Wind</h2>
<p>Soft mountain breeze.</p>
<button onclick="playSound('wind')">▶ Play</button>
</div>

<div class="sound-card">
<h2>💦 Waterfall</h2>
<p>Natural waterfall sounds.</p>
<button onclick="playSound('waterfall')">▶ Play</button>
</div>

</section>

<div class="controls">

<button onclick="stopSound()">⏹ Stop</button>

</div>

<audio id="player"></audio>

<script>

const player = document.getElementById("player");

function playSound(sound){

if(sound==="rain"){
player.src="rain.mp3";
}

else if(sound==="forest"){
player.src="forest.mp3";
}

else if(sound==="ocean"){
player.src="ocean.mp3";
}

else if(sound==="birds"){
player.src="birds.mp3";
}

else if(sound==="wind"){
player.src="wind.mp3";
}

else if(sound==="waterfall"){
player.src="waterfall.mp3";
}

player.play();

}

function stopSound(){

player.pause();
player.currentTime=0;

}

</script>

</body>

</html>
