<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Sounds - MindFresh AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Simplified Navigation for Sub-pages -->
    <nav>
        <div class="logo">
            <a href="index.html" style="color: inherit; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <!-- Sounds Section -->
    <section class="features" style="margin-top: 50px;">
        <div style="width: 100%; text-align: center; margin-bottom: 40px;">
            <h1 style="color: #00d2ff;">Relaxing Nature Sounds</h1>
            <p style="color: #aebfc5;">Select a sound to calm your mind and improve focus.</p>
        </div>
        
        <!-- Rain Sound -->
        <div class="card">
            <i class="fa-solid fa-cloud-rain"></i>
            <h2>Gentle Rain</h2>
            <audio controls style="width: 100%; margin-top: 15px;">
                <source src="rain.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Forest Sound -->
        <div class="card">
            <i class="fa-solid fa-tree"></i>
            <h2>Forest Walk</h2>
            <audio controls style="width: 100%; margin-top: 15px;">
                <source src="forest.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Ocean Sound -->
        <div class="card">
            <i class="fa-solid fa-water"></i>
            <h2>Ocean Waves</h2>
            <audio controls style="width: 100%; margin-top: 15px;">
                <source src="ocean.mp3" type="audio/mpeg">
            </audio>
        </div>

    </section>

</body>
</html>
