<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFresh AI Chat</title>
  <style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#071E26,#0D3B49,#155B6B);
padding:15px;
}

.chat-container{
width:100%;
max-width:430px;
height:92vh;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.15);
border-radius:25px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.header{
padding:20px;
text-align:center;
background:rgba(255,255,255,0.08);
border-bottom:1px solid rgba(255,255,255,0.15);
}

.header h2{
color:#00E5FF;
font-size:28px;
margin-bottom:5px;
}

.header p{
color:white;
font-size:14px;
}

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
background:transparent;
}

.bot{
background:rgba(0,229,255,0.15);
color:white;
padding:14px;
border-radius:18px;
width:80%;
margin-bottom:15px;
}
  
#typing{

font-style:italic;
opacity:0.8;
animation:blink 1s infinite;

}

@keyframes blink{

0%{
opacity:.3;
}

50%{
opacity:1;
}

100%{
opacity:.3;
}

}
.user{
background:#00BCD4;
color:white;
padding:14px;
border-radius:18px;
width:80%;
margin-left:auto;
margin-bottom:15px;
}

.input-area{
display:flex;
padding:12px;
background:rgba(255,255,255,0.05);
}

.input-area input{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:30px;
background:rgba(255,255,255,0.10);
color:white;
font-size:15px;
}

.input-area input::placeholder{
color:#dddddd;
}

.input-area button{
margin-left:10px;
padding:12px 20px;
border:none;
border-radius:30px;
background:#00E5FF;
color:#002B36;
font-weight:bold;
cursor:pointer;
}

.input-area button:hover{
background:#00BCD4;
}

.bottom-buttons{
display:flex;
justify-content:space-around;
padding:10px;
background:rgba(255,255,255,0.05);
}

.bottom-buttons button{
padding:10px 18px;
border:none;
border-radius:25px;
background:#00BCD4;
color:white;
font-size:14px;
cursor:pointer;
}

.bottom-buttons button:hover{
background:#0097A7;
}
  
    </style>

</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h2>🤖 MindFresh AI</h2>
            <p>Your Smart Mental Wellness Assistant</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="bot">
                👋 Hello! Welcome to MindFresh AI.
                <br><br>
                How are you feeling today?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message...">

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

        <div class="bottom-buttons">

            <button onclick="clearChat()">
                🗑 Clear
            </button>


        </div>

    </div>
<script>
    function sendMessage() {

let input = document.getElementById("userInput");

let chatBox = document.getElementById("chatBox");

let message = input.value.trim();

if(message=="") return;

chatBox.innerHTML +=
"<div class='user'>" + message + "</div>";
input.value = "";
let reply = "";

let text = message.toLowerCase();

if(text.includes("hello") || text.includes("hi")){

reply="👋 Hello! Welcome to MindFresh AI.";

}

else if(text.includes("sad")){

reply="💙 I'm here for you. Better days are coming. Stay strong.";

}

else if(text.includes("happy")){

reply="😊 That's wonderful! Keep smiling and enjoy your day.";

}

else if(text.includes("stress")){

reply="🌿 Close your eyes, breathe slowly for 10 seconds. You can do it.";

}

else if(text.includes("angry")){

reply="😌 Take a deep breath. Calmness gives better solutions.";

}

else if(text.includes("tired")){

reply="😴 Take some rest, drink water and relax for a while.";

}

else if(text.includes("thank")){

reply="❤️ You're always welcome.";

}
else if(text.includes("math")){

reply="📘 I can help you solve Math problems step by step.";

}

else if(text.includes("html")){

reply="💻 I can teach HTML with easy examples and coding.";

}

else if(text.includes("css")){

reply="🎨 I can help you design beautiful websites using CSS.";

}

else if(text.includes("javascript")){

reply="⚡ I can teach JavaScript and help you build projects.";

}

else if(text.includes("python")){

reply="🐍 I can help you learn Python programming.";

}

else if(text.includes("java")){

reply="☕ I can explain Java programming with examples.";

}

else if(text.includes("c") || text.includes("c programming")){

reply="💻 I can help you understand C Programming.\n\n📘 Definition:\nC is a powerful, fast and structured programming language developed by Dennis Ritchie in 1972 at Bell Labs.\n\n⭐ Uses:\n• Operating Systems\n• Embedded Systems\n• Software Development\n• Games\n\n🚀 Ask me if you want a C program or C notes.";

}
else if(text.includes("exam")){

reply="📝 I can help you prepare for exams and revise important topics.";

}

else if(text.includes("study")){

reply="📚 I'm your study partner. Ask me any subject or programming question.";

}
else{

reply="🤖 I understand. Tell me more about how you're feeling.";

}
let typing = document.createElement("div");

typing.className = "bot";

typing.id = "typing";

typing.innerHTML = "🤖 MindFresh AI is typing...";

chatBox.appendChild(typing);

chatBox.scrollTop = chatBox.scrollHeight;
setTimeout(function(){

document.getElementById("typing").remove();

chatBox.innerHTML +=
"<div class='bot'>" + reply + "</div>";

chatBox.scrollTop = chatBox.scrollHeight;

},1500);}
  function clearChat(){

document.getElementById("chatBox").innerHTML=
"<div class='bot'>👋 Chat Cleared.<br><br>How are you feeling today?</div>";

}

function startVoice(){

alert("🎤 Voice Feature Coming Soon!");

}

document.getElementById("userInput").addEventListener("keypress",function(e){

if(e.key==="Enter"){

sendMessage();

}

});

    </script>

</body>

</html>
