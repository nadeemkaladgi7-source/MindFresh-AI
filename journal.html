<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindFresh AI - Journal</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#0b1d2c,#12394f,#0a4d68);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:430px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.back-btn{
display:inline-flex;
align-items:center;
gap:8px;
text-decoration:none;
color:#00e5ff;
font-size:18px;
margin-bottom:20px;
}

.icon{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:rgba(0,229,255,.15);
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
color:#00e5ff;
margin-bottom:15px;
}

h1{
text-align:center;
font-size:34px;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#d9d9d9;
margin-bottom:20px;
}

.date{
text-align:center;
padding:12px;
background:rgba(255,255,255,.08);
border-radius:12px;
margin-bottom:20px;
font-size:16px;
}

textarea{
width:100%;
height:250px;
background:rgba(255,255,255,.08);
border:none;
outline:none;
border-radius:15px;
padding:18px;
font-size:16px;
color:white;
resize:none;
}

textarea::placeholder{
color:#cfcfcf;
}

.buttons{
display:flex;
gap:15px;
margin-top:20px;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.save{
background:#00c853;
color:white;
}

.save:hover{
transform:scale(1.05);
}

.clear{
background:#ff3d3d;
color:white;
}

.clear:hover{
transform:scale(1.05);
}

.message{
margin-top:20px;
text-align:center;
display:none;
font-weight:bold;
color:#00ff95;
}

</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back-btn">
<i class="fas fa-arrow-left"></i> Back
</a>

<div class="card">

<div class="icon">
<i class="fas fa-book"></i>
</div>

<h1>My Journal</h1>

<p class="subtitle">
Write your daily thoughts and feelings.
</p>

<div class="date" id="date"></div>

<textarea
id="journal"
placeholder="Write your thoughts here..."></textarea>

<div class="buttons">

<button class="save"
onclick="saveJournal()">
<i class="fas fa-save"></i>
Save
</button>

<button class="clear"
onclick="clearJournal()">
<i class="fas fa-trash"></i>
Clear
</button>

</div>

<div class="message"
id="msg">
Journal Saved Successfully ✔
</div>

</div>

</div>

<script>
  // Today's Date
const today = new Date();

const options = {
weekday: "long",
year: "numeric",
month: "long",
day: "numeric"
};

document.getElementById("date").innerHTML =
today.toLocaleDateString("en-IN", options);


// Load Saved Journal
window.onload = function(){

const saved =
localStorage.getItem("mindfreshJournal");

if(saved){
document.getElementById("journal").value = saved;
}

};


// Save Journal
function saveJournal(){

const text =
document.getElementById("journal").value;

localStorage.setItem(
"mindfreshJournal",
text
);

const msg =
document.getElementById("msg");

msg.style.display="block";

setTimeout(()=>{
msg.style.display="none";
},2000);

}


// Clear Journal
function clearJournal(){

if(confirm("Clear your journal?")){

document.getElementById("journal").value="";

localStorage.removeItem("mindfreshJournal");

document.getElementById("msg").innerHTML="Journal Cleared 🗑️";

document.getElementById("msg").style.display="block";

setTimeout(()=>{

document.getElementById("msg").style.display="none";

document.getElementById("msg").innerHTML="Journal Saved Successfully ✔";

},2000);

}

}
  </script>

</body>
</html>
