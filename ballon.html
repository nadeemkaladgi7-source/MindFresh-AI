<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Pop - Relaxing Balloon Game</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-dark: #0a0a12;
            --panel-bg: rgba(20, 20, 35, 0.6);
            --glow-color: rgba(139, 92, 246, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND EFFECTS --- */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.2;
            z-index: 1;
        }

        /* --- GAME CANVAS / CONTAINER --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 800px;
            background: radial-gradient(circle at center, #131326 0%, var(--bg-dark) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0,0,0,0.6);
            overflow: hidden;
            border-radius: 20px;
            z-index: 2;
        }

        @media (max-width: 1000px), (max-height: 800px) {
            #game-container {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
        }

        /* --- UI OVERLAYS --- */
        .hud {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: var(--text-muted);
        }

        .hud-card span {
            color: var(--text-main);
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* --- START SCREENS --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--glow-color);
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .btn {
            background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.6);
        }

        /* --- BALLOONS & ANIMATIONS --- */
        .balloon-wrapper {
            position: absolute;
            cursor: pointer;
            transform-origin: bottom center;
            will-change: transform;
        }

        .balloon {
            position: relative;
            width: 70px;
            height: 85px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset -8px -10px 20px rgba(0,0,0,0.35);
            transition: transform 0.1s ease;
        }

        .balloon::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 15px;
            width: 15px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .balloon-knot {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            pointer-events: none;
        }

        .balloon-string {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 50px;
            pointer-events: none;
            opacity: 0.5;
        }

        /* --- FLOATING PARTICLES (ON POP) --- */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: explode 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* --- MOTIVATIONAL TEXT --- */
        .motivation-msg {
            position: absolute;
            pointer-events: none;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            animation: floatUpAndFade 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 50;
        }

        @keyframes floatUpAndFade {
            0% {
                transform: translate(-50%, 0) scale(0.7);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, -30px) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -100px) scale(1);
                opacity: 0;
            }
        }

        .mute-btn {
            pointer-events: auto !important;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mute-btn:hover { color: #fff; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div id="game-container">
        <!-- HUD Interface -->
        <div class="hud">
            <div class="hud-card">Score: <span id="score-display">0</span></div>
            <div class="hud-card mute-btn" id="mute-btn">
                Sound: <span id="mute-status">ON</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="screen" id="start-screen">
            <h1>ZEN POP</h1>
            <p class="subtitle">Floating colors. Calming pops. Relax your mind.</p>
            <button class="btn" id="start-btn">Begin Journey</button>
        </div>

        <!-- Play Area -->
        <div id="play-area" style="position: relative; width: 100%; height: 100%;"></div>
    </div>

    <script>
        // --- GAME STATE ---
        const state = {
            score: 0,
            popCountSinceLastMsg: 0, // Counts up to 5 for motivation triggers
            isPlaying: false,
            soundEnabled: true,
            balloons: [],
            animationFrameId: null,
            lastSpawnTime: 0,
            spawnSpeed: 1200 
        };

        // --- PALETTES & TEXT ARRAYS ---
        const colors = [
            { main: '#a78bfa', shadow: '#7c3aed' }, 
            { main: '#f472b6', shadow: '#db2777' }, 
            { main: '#38bdf8', shadow: '#0284c7' }, 
            { main: '#34d399', shadow: '#059669' }, 
            { main: '#fb7185', shadow: '#e11d48' }, 
            { main: '#fbbf24', shadow: '#d97706' }  
        ];

        const positiveMessages = [
            "Wow!", 
            "Beautiful!", 
            "Nice!", 
            "Wonderful!", 
            "So Peaceful...", 
            "Excellent!", 
            "Lovely!",
            "Keep Relaxing..."
        ];

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const scoreDisplay = document.getElementById('score-display');
        const muteBtn = document.getElementById('mute-btn');
        const muteStatus = document.getElementById('mute-status');
        const playArea = document.getElementById('play-area');

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPopSound() {
            if (!state.soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);

            // Harmonic chime layer
            const echoOsc = audioCtx.createOscillator();
            const echoGain = audioCtx.createGain();
            echoOsc.type = 'triangle';
            echoOsc.frequency.setValueAtTime(880, now);
            echoOsc.frequency.exponentialRampToValueAtTime(440, now + 0.2);
            echoGain.gain.setValueAtTime(0.06, now);
            echoGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            
            echoOsc.connect(echoGain);
            echoGain.connect(audioCtx.destination);
            echoOsc.start(now);
            echoOsc.stop(now + 0.4);
        }

        // --- GAMEPLAY FUNCTIONS ---
        function initGame() {
            state.score = 0;
            state.popCountSinceLastMsg = 0;
            scoreDisplay.textContent = state.score;
            state.isPlaying = true;
            state.balloons = [];
            playArea.innerHTML = '';
            
            startScreen.classList.add('hidden');
            state.lastSpawnTime = Date.now();
            gameLoop();
        }

        function gameLoop() {
            if (!state.isPlaying) return;

            const now = Date.now();
            if (now - state.lastSpawnTime > state.spawnSpeed) {
                createBalloon();
                state.lastSpawnTime = now;
            }

            updateBalloons();
            state.animationFrameId = requestAnimationFrame(gameLoop);
        }

        function createBalloon() {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const wrapper = document.createElement('div');
            wrapper.className = 'balloon-wrapper';
            
            const scale = 0.7 + Math.random() * 0.5; 
            wrapper.style.transform = `scale(${scale})`;
            
            const radius = 35 * scale;
            const x = radius + Math.random() * (playArea.clientWidth - radius * 3);
            wrapper.style.left = `${x}px`;
            wrapper.style.bottom = `-150px`; 

            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.backgroundColor = color.main;
            balloon.style.boxShadow = `inset -8px -10px 20px rgba(0,0,0,0.35), 0 0 15px ${color.main}44`;

            const knot = document.createElement('div');
            knot.className = 'balloon-knot';
            knot.style.borderBottom = `10px solid ${color.main}`;

            const stringSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            stringSvg.setAttribute('class', 'balloon-string');
            stringSvg.setAttribute('viewBox', '0 0 10 50');
            stringSvg.innerHTML = `<path d="M5,0 Q8,12.5 5,25 T5,50" fill="none" stroke="${color.main}" stroke-width="1.5" />`;

            wrapper.appendChild(balloon);
            wrapper.appendChild(knot);
            wrapper.appendChild(stringSvg);
            playArea.appendChild(wrapper);

            const balloonObj = {
                element: wrapper,
                y: -150,
                speed: 1.2 + Math.random() * 1.5,
                swayRange: 10 + Math.random() * 20,
                swaySpeed: 0.01 + Math.random() * 0.02,
                angle: Math.random() * 100,
                color: color.main
            };

            state.balloons.push(balloonObj);

            const popEvent = (e) => {
                e.preventDefault();
                popBalloon(balloonObj);
            };
            wrapper.addEventListener('mousedown', popEvent);
            wrapper.addEventListener('touchstart', popEvent, {passive: false});
        }

        function updateBalloons() {
            for (let i = state.balloons.length - 1; i >= 0; i--) {
                const b = state.balloons[i];
                b.y += b.speed;
                b.angle += b.swaySpeed;
                const currentSway = Math.sin(b.angle) * b.swayRange;
                
                b.element.style.transform = `translate3d(${currentSway}px, -${b.y}px, 0) ${b.element.style.transform.replace(/translate3d\(.*?\)/g, '')}`;

                if (b.y > playArea.clientHeight + 200) {
                    b.element.remove();
                    state.balloons.splice(i, 1);
                }
            }
        }

        function popBalloon(balloonObj) {
            const idx = state.balloons.indexOf(balloonObj);
            if (idx === -1) return;

            state.balloons.splice(idx, 1);
            playPopSound();

            const rect = balloonObj.element.getBoundingClientRect();
            const parentRect = playArea.getBoundingClientRect();
            const centerX = rect.left - parentRect.left + rect.width / 2;
            const centerY = rect.top - parentRect.top + rect.height / 2;
            
            createExplosion(centerX, centerY, balloonObj.color);

            balloonObj.element.style.pointerEvents = 'none';
            balloonObj.element.style.transition = 'transform 0.1s ease-out';
            balloonObj.element.style.transform += ' scale(1.3)';
            
            setTimeout(() => balloonObj.element.remove(), 80);

            // Update scores and counters
            state.score++;
            state.popCountSinceLastMsg++;
            scoreDisplay.textContent = state.score;

            // Trigger encouragement after every 5 bursts
            if (state.popCountSinceLastMsg >= 5) {
                triggerMotivationalMessage(centerX, centerY, balloonObj.color);
                state.popCountSinceLastMsg = 0;
            }
        }

        function createExplosion(x, y, color) {
            const particleCount = 12;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                const size = 6 + Math.random() * 8;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 100;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);

                playArea.appendChild(particle);
                particle.addEventListener('animationend', () => particle.remove());
            }
        }

        function triggerMotivationalMessage(x, y, color) {
            const msgEl = document.createElement('div');
            msgEl.className = 'motivation-msg';
            
            // Grab a random peaceful text snippet
            const text = positiveMessages[Math.floor(Math.random() * positiveMessages.length)];
            msgEl.textContent = text;
            
            // Stylize colors match the popped balloon + crisp text glow
            msgEl.style.color = color;
            msgEl.style.left = `${x}px`;
            msgEl.style.top = `${y - 30}px`; // Display slightly above pop coordinates

            playArea.appendChild(msgEl);

            // Housekeeping: drop DOM tree elements upon animation completion
            msgEl.addEventListener('animationend', () => {
                msgEl.remove();
            });
        }

        // --- CONTROLS ---
        startBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            initGame();
        });

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            state.soundEnabled = !state.soundEnabled;
            muteStatus.textContent = state.soundEnabled ? "ON" : "OFF";
        });
    </script>
</body>
</html>
