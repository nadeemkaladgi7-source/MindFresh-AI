<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Color Shade Finder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: #191826;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Top Stats Bar */
    .stats-card {
      background: #252436;
      border-radius: 16px;
      padding: 15px 25px;
      display: flex;
      gap: 25px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 15px;
      border: 1px solid #333148;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #9d9bb0;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .coin-val {
      color: #ffd700;
    }

    /* Power-ups Bar */
    .powerups-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-powerup {
      background: #2d2b42;
      border: 1px solid #434063;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-powerup:hover:not(:disabled) {
      background: #3a3756;
      transform: translateY(-2px);
    }

    .btn-powerup:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Main Board Container */
    .game-board-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    .game-grid {
      display: grid;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .tile {
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s;
    }

    .tile:active {
      transform: scale(0.96);
    }

    .tile.hint-active {
      animation: pulse 0.8s infinite alternate;
      border: 3px solid #ffffff;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* Shake animation on wrong tap */
    .shake {
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Game Over Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 14, 23, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: #232234;
      border: 1px solid #383652;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ff5252;
    }

    .modal-stats {
      margin: 20px 0;
      font-size: 1rem;
      line-height: 1.8;
      color: #cccccc;
    }

    .btn-restart {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }

    .btn-restart:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  <h1>Color Shade Finder</h1>

  <!-- Stats Header -->
  <div class="stats-card">
    <div class="stat-item">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Time</div>
      <div class="stat-value" id="timer">30s</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">High Score</div>
      <div class="stat-value" id="high-score">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Coins</div>
      <div class="stat-value coin-val" id="coins">🪙 0</div>
    </div>
  </div>

  <!-- Powerups -->
  <div class="powerups-bar">
    <button class="btn-powerup" id="btn-hint" onclick="useHint()">💡 Hint (5 🪙)</button>
    <button class="btn-powerup" id="btn-time" onclick="buyTime()">⏳ +5s (10 🪙)</button>
  </div>

  <!-- Game Board Grid -->
  <div class="game-board-container" id="board-container">
    <div class="game-grid" id="grid"></div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal-overlay" id="game-over-modal">
    <div class="modal-box">
      <h2 class="modal-title">Game Over!</h2>
      <div class="modal-stats">
        <p>Final Score: <strong id="final-score" style="color:#fff;">0</strong></p>
        <p>Coins Earned: <strong id="earned-coins" style="color:#ffd700;">+0</strong></p>
      </div>
      <button class="btn-restart" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    // Game State Variables
    let score = 0;
    let coins = parseInt(localStorage.getItem('csf_coins')) || 0;
    let highScore = parseInt(localStorage.getItem('csf_highscore')) || 0;
    let timeLeft = 30;
    let timerInterval = null;
    let targetIndex = -1;
    let gridSize = 2;
    let isGameRunning = false;

    // UI Elements
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const highScoreEl = document.getElementById('high-score');
    const coinsEl = document.getElementById('coins');
    const gridEl = document.getElementById('grid');
    const modalEl = document.getElementById('game-over-modal');
    const boardContainer = document.getElementById('board-container');

    // Web Audio Sound Synthesizer (No external assets needed)
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'powerup') {
          osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        }
      } catch (e) {
        // Fallback if audio fails
      }
    }

    // Initialize Game State
    function init() {
      highScoreEl.textContent = highScore;
      coinsEl.textContent = `🪙 ${coins}`;
      updatePowerupButtons();
      startGame();
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      isGameRunning = true;
      scoreEl.textContent = score;
      timerEl.textContent = `${timeLeft}s`;
      modalEl.classList.remove('active');
      
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);
      
      renderLevel();
    }

    function updateTimer() {
      timeLeft--;
      timerEl.textContent = `${timeLeft}s`;
      if (timeLeft <= 0) {
        endGame();
      }
    }

    // Calculate Dynamic Grid Size & Color Difference based on Score
    function renderLevel() {
      if (score < 4) gridSize = 2;
      else if (score < 10) gridSize = 3;
      else if (score < 20) gridSize = 4;
      else gridSize = 5;

      gridEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
      gridEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
      gridEl.innerHTML = '';

      const totalTiles = gridSize * gridSize;
      targetIndex = Math.floor(Math.random() * totalTiles);

      // Random Base Color (HSL)
      const h = Math.floor(Math.random() * 360);
      const s = Math.floor(Math.random() * 40) + 50; // 50% - 90%
      const l = Math.floor(Math.random() * 40) + 30; // 30% - 70%

      // Higher score = smaller difference = harder to detect
      const diff = Math.max(3, 20 - Math.floor(score * 0.6));
      const targetL = (l + diff > 90) ? l - diff : l + diff;

      const baseColor = `hsl(${h}, ${s}%, ${l}%)`;
      const targetColor = `hsl(${h}, ${s}%, ${targetL}%)`;

      for (let i = 0; i < totalTiles; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.backgroundColor = (i === targetIndex) ? targetColor : baseColor;
        tile.addEventListener('click', () => handleTileClick(i));
        gridEl.appendChild(tile);
      }
    }

    function handleTileClick(index) {
      if (!isGameRunning) return;

      if (index === targetIndex) {
        // Correct Click
        playSound('correct');
        score++;
        coins++;
        
        // Save to storage
        localStorage.setItem('csf_coins', coins);
        coinsEl.textContent = `🪙 ${coins}`;
        scoreEl.textContent = score;

        updatePowerupButtons();
        renderLevel();
      } else {
        // Wrong Click
        playSound('wrong');
        timeLeft = Math.max(0, timeLeft - 3); // Penalty of -3s
        timerEl.textContent = `${timeLeft}s`;
        
        boardContainer.classList.add('shake');
        setTimeout(() => boardContainer.classList.remove('shake'), 300);
      }
    }

    // Power-Up: Highlight the target tile
    function useHint() {
      if (!isGameRunning || coins < 5) return;
      coins -= 5;
      localStorage.setItem('csf_coins', coins);
      coinsEl.textContent = `🪙 ${coins}`;
      playSound('powerup');

      const tiles = gridEl.querySelectorAll('.tile');
      if (tiles[targetIndex]) {
        tiles[targetIndex].classList.add('hint-active');
      }
      updatePowerupButtons();
    }

    // Power-Up: Add Extra +5 Seconds
    function buyTime() {
      if (!isGameRunning || coins < 10) return;
      coins -= 10;
      timeLeft += 5;
      localStorage.setItem('csf_coins', coins);
      coinsEl.textContent = `🪙 ${coins}`;
      timerEl.textContent = `${timeLeft}s`;
      playSound('powerup');
      updatePowerupButtons();
    }

    function updatePowerupButtons() {
      document.getElementById('btn-hint').disabled = coins < 5;
      document.getElementById('btn-time').disabled = coins < 10;
    }

    function endGame() {
      isGameRunning = false;
      clearInterval(timerInterval);
      playSound('wrong');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('csf_highscore', highScore);
        highScoreEl.textContent = highScore;
      }

      document.getElementById('final-score').textContent = score;
      document.getElementById('earned-coins').textContent = `+${score} 🪙`;
      modalEl.classList.add('active');
    }

    function restartGame() {
      startGame();
    }

    // Start on page load
    window.onload = init;
  </script>
</body>
</html>
